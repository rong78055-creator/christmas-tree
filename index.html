<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Merry Christmas · 3D Rotating Tree</title>
<!-- 引入 Google 的免费网络花体字 -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:system-ui,"Microsoft YaHei",sans-serif}
canvas{display:block;width:100vw;height:100vh;background:#000}
.tools{position:fixed;left:14px;top:14px;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 11px;border:1px solid #ffffff35;border-radius:10px;background:#07101dcc;color:#fff;font:13px system-ui,sans-serif;backdrop-filter:blur(7px)}
.tools label{display:flex;align-items:center;gap:5px}
.tools input[type=text]{width:105px;padding:6px;border:1px solid #ffffff40;border-radius:6px;background:#101b2b;color:white}
.tools input[type=range]{width:85px;accent-color:#b6e9ff}
button{padding:6px 10px;border:1px solid #ffffff40;border-radius:6px;background:#18364b;color:#fff;cursor:pointer}
button:hover{background:#28536d}
.note{position:fixed;right:12px;bottom:9px;color:#ffffff80;font:11px system-ui,sans-serif}
@media(max-width:560px){
  .tools{left:7px;right:7px;top:7px;gap:6px}
  .tools input[type=text]{width:75px}
  .note{display:none}
}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div class="tools">
  <label>显示文字 <input id="name" type="text" value="xiaoqing xx" maxlength="30"></label>
  <label>旋转速度 <input id="speed" type="range" min="0" max="3" step="0.1" value="1"></label>
  <button id="pause">暂停</button>
  <button id="full">全屏</button>
</div>
<div class="note">基于 ZekangLi-Zico / Christmas-Tree 的 Pygame 原作改编为 HTML Canvas</div>
<script>
(() => {
"use strict";
let WIDTH, HEIGHT;
const TREE_POINTS=50000,GROUND_POINTS=4000,STAR_POINTS=1200,HEART_POINTS=1000,SNOW_COUNT=10;
const CAM_DIST=13,CAM_HEIGHT=6,PITCH=-.25,TREE_HEIGHT=12,TAU=Math.PI*2;
const canvas=document.getElementById("screen"),ctx=canvas.getContext("2d",{alpha:false});
let dpr=1,paused=false,speed=1,angle=0,lastTime=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1, 1.5);
  WIDTH=window.innerWidth;
  HEIGHT=window.innerHeight;
  canvas.width=Math.round(WIDTH*dpr);
  canvas.height=Math.round(HEIGHT*dpr);
  
  if (typeof snow !== 'undefined') {
    snow.length = 0;
    for(let i=0;i<SNOW_COUNT;i++){
      const f=newFlake();
      f[1]=rand(-80,HEIGHT);
      f[4]=rand(0,f[5]);
      snow.push(f);
    }
  }
}
addEventListener("resize",resize);

const rand=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rand(a,b+1));
function gaussian(mean,sd){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return mean+sd*Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);}
const tree=[],ground=[],stars=[],heart=[];

function genTree(){
 const spiralN=Math.floor(TREE_POINTS*.7),loops=9;
 for(let i=0;i<spiralN;i++){
  const u=Math.random(),h=Math.pow(u,1.6),y=TREE_HEIGHT*h+.2;
  let baseR=Math.pow(1-h,1.1)*3.2;
  baseR*=1+.65*Math.max(0,Math.sin((h*5.8+.15)*TAU));
  const a=u*loops*TAU+rand(-.22,.22),r=baseR*rand(.85,1.08);
  const mid=Math.max(.15,1-Math.abs(h-.55)*1.5);
  const color=[
    Math.min(255,120+Math.floor(60*mid)+ri(-15,20)),
    Math.min(255,190+Math.floor(45*mid)+ri(-10,20)),
    Math.min(255,245+ri(0,10))
  ];
  if(Math.random()<.08)color.splice(0,3,235,246,255);
  tree.push([Math.cos(a)*r,y,Math.sin(a)*r,color]);
 }
 for(let i=spiralN;i<TREE_POINTS;i++){
  const h=Math.pow(Math.random(),1.9),y=TREE_HEIGHT*h+.2+rand(-.08,.08);
  let baseR=Math.pow(1-h,1.1)*4.3;
  baseR*=1+.65*Math.max(0,Math.sin((h*5.8+.15)*TAU));
  const r=baseR*Math.sqrt(Math.random()),a=Math.random()*TAU;
  tree.push([Math.cos(a)*r+rand(-.08,.08),y,Math.sin(a)*r+rand(-.08,.08),[ri(120,180),ri(195,235),ri(245,255)]]);
 }
}
function genGround(){
 const rings=[4.6,6,7.4,8.8,10.2,11.4];
 for(let i=0;i<GROUND_POINTS;i++){
  const r=gaussian(rings[ri(0,rings.length-1)],.3),a=Math.random()*TAU,c=Math.random()<.15?ri(235,255):ri(190,235);
  ground.push([Math.cos(a)*r,-.25,Math.sin(a)*r,[c,c,255]]);
 }
}
function genStars(){for(let i=0;i<STAR_POINTS;i++){const b=ri(215,255);stars.push([rand(-18,18),rand(3,18),rand(-18,18),[b,b,255]]);}}
function genHeart(){
 while(heart.length<HEART_POINTS){
  const x=rand(-1.3,1.3),y=rand(-1.4,1.4),f=Math.pow(x*x+y*y-1,3)-x*x*Math.pow(y,3);
  if(f<=0){
   const wx=x*.9*.8,wy=TREE_HEIGHT+.05+(y+1)*.9*.5,wz=rand(-.18,.18),dist=Math.hypot(x,y),factor=Math.max(.35,1.15-.5*dist);
   heart.push([wx,wy,wz,[255,Math.max(120,Math.min(255,Math.floor(130*factor+80))),Math.max(120,Math.min(255,Math.floor(190*factor+70)))]]);
  }
 }
}
genTree();genGround();genStars();genHeart();
const all=tree.concat(ground,stars,heart);
const snow=[];
function newFlake(y=rand(-80,-10)){
 const r=rand(10,16),v=rand(30,45),max=(HEIGHT+80-y)/v;
 return [rand(0,WIDTH),y,r,v,max,max];
}
resize(); 

function project(p){
 const ca=Math.cos(angle),sa=Math.sin(angle),xz=p[0]*ca-p[2]*sa,zz=p[0]*sa+p[2]*ca;
 const cp=Math.cos(PITCH),sp=Math.sin(PITCH),yp=p[1]*cp-zz*sp,zp=p[1]*sp+zz*cp+CAM_DIST;
 const y2=yp-CAM_HEIGHT;if(zp<=.1)return null;
 const f=(Math.max(WIDTH,HEIGHT)*0.63)/zp; 
 return [WIDTH/2+xz*f,HEIGHT/2-y2*f,zp];
}
function drawSnow(dt){
 for(let f of snow){
  f[1]+=f[3]*dt;f[4]-=dt;
  if(f[4]<=0||f[1]>HEIGHT+50){const n=newFlake();for(let i=0;i<6;i++)f[i]=n[i];}
  const phase=f[4]/f[5],alpha=phase>.3?1:Math.max(0,phase/.3),x=f[0],y=f[1],r=f[2];
  ctx.save();ctx.globalAlpha=alpha;
  const sizes=[r*1.3,r,r*.75,r*.55,r*.45],alphas=[.05,.083,.167,.333,1];
  for(let i=0;i<sizes.length;i++){ctx.globalAlpha=alpha*alphas[i];ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,Math.max(1,sizes[i]),0,TAU);ctx.fill();}
  ctx.restore();
 }
}
function render(t){
 const dt=Math.min(.05,(t-lastTime)/1000||0);lastTime=t;
 if(!paused)angle+=.0045*speed*(dt*60||1);
 
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle="#000";ctx.fillRect(0,0,WIDTH,HEIGHT);
 
 const draw=[];
 for(const p of all){
  const q=project(p);
  if(!q)continue;
  const [x,y,depth]=q;
  if(x<0||x>=WIDTH||y<0||y>=HEIGHT)continue;
  draw.push([depth,x,y,Math.max(1,Math.floor(3.6-depth*.13)),p[3]]);
 }
 draw.sort((a,b)=>b[0]-a[0]);
 for(const item of draw){
  const [,x,y,r,c]=item;
  ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
 }
 
 const fontSize = Math.max(24, Math.min(WIDTH * 0.06, 45));
 ctx.fillStyle="#fff";
 ctx.textAlign="left";
 // 使用新引入的网络字体，如果加载不到再用后备字体
 ctx.font=`600 ${fontSize}px "Dancing Script", "Great Vibes", "Monotype Corsiva", cursive`;
 const startY = HEIGHT * 0.25;
 ctx.fillText("Merry Christmas", 20, startY);
 
 ctx.font=`600 ${fontSize * 0.9}px "Dancing Script", "Great Vibes", "Monotype Corsiva", cursive`;
 ctx.fillText(document.getElementById("name").value, 20, startY + fontSize + 10);
 
 drawSnow(dt);
 requestAnimationFrame(render);
}
document.getElementById("speed").addEventListener("input",e=>speed=Number(e.target.value));
document.getElementById("pause").addEventListener("click",e=>{paused=!paused;e.currentTarget.textContent=paused?"继续":"暂停";});
document.getElementById("full").addEventListener("click",()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();});
requestAnimationFrame(render);
})();
</script>
</body>
</html>
